<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارتی بەنزینی کەرکوک</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>کارتی بەنزینی کەرکوک</h1>
        <div class="main-circle">
            <span id="current-day-label">ڕۆژی یەکەم</span>
            <span id="current-day-number">١</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p id="remaining-text">٤ ڕۆژ ماوە</p>
        <div class="dates-info">
            <div class="date-box">
                <span>ڕۆژی یەکەم</span>
                <strong id="start-date">---</strong>
            </div>
            <div class="date-box">
                <span>ڕۆژی کۆتایی</span>
                <strong id="end-date">---</strong>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
