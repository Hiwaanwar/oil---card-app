name: Build APK Simple

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clone Template
      run: |
        git clone https://github.com/android/architecture-samples.git temp_android
        cp -r temp_android/app .
        cp -r temp_android/build.gradle .
        cp -r temp_android/settings.gradle .
        cp -r temp_android/gradle .
        cp temp_android/gradlew .
        cp temp_android/gradlew.bat .

    - name: Add Files and Icon
      run: |
        mkdir -p app/src/main/assets
        cp index.html app/src/main/assets/
        cp style.css app/src/main/assets/
        cp script.js app/src/main/assets/

        # إضافة الأيقونة (سيأخذ الملف الوهمي حالياً)
        mkdir -p app/src/main/res/mipmap-hdpi
        cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.android.architecture.blueprints.todoapp">
            <application 
                android:label="کۆبۆنی بەنزین" 
                android:icon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.NoTitleBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/android/architecture/blueprints/todoapp/MainActivity.java
        package com.example.android.architecture.blueprints.todoapp;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                webView.getSettings().setJavaScriptEnabled(true);
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OilCard-APK
        path: app/build/outputs/apk/debug/app-debug.apk
